  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Product header band ───────────────────────────── */
    .product-header-band {
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      border-left: 6px solid var(--color-brand);
      box-shadow: var(--shadow-sm);
      padding: var(--space-5) var(--space-6);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-6);
      margin-bottom: var(--space-5);
    }
    .product-header-band .phb-left {}
    .phb-name-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .phb-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: -0.3px;
    }
    .phb-meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: 13px;
      color: var(--color-muted);
    }
    .phb-meta-sep { color: var(--color-border); }
    .phb-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
    }
    .badge-lg {
      height: 26px;
      padding: 0 12px;
      font-size: 12px;
    }

    /* ── Two-col layout below header ───────────────────── */
    .detail-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-5);
      margin-bottom: var(--space-5);
    }

    /* ── Version sidebar ───────────────────────────────── */
    .version-sidebar {}
    .version-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }
    .version-sidebar-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .version-list { display: flex; flex-direction: column; gap: 2px; }
    .version-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background .1s;
      border: 1px solid transparent;
    }
    .version-item:hover { background: var(--color-surface); }
    .version-item.active {
      background: var(--color-brand-light);
      border-color: var(--color-brand-light);
    }
    .version-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      background: var(--color-panel);
      flex-shrink: 0;
      margin-top: 4px;
    }
    .version-item.active .version-dot {
      background: var(--color-brand);
      border-color: var(--color-brand);
    }
    .version-item-body { flex: 1; min-width: 0; }
    .version-label-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: 3px;
    }
    .version-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-ink);
    }
    .version-item.active .version-label { color: var(--color-brand); }
    .version-period {
      font-size: 11px;
      color: var(--color-muted);
    }
    .version-by { font-size: 11px; color: var(--color-muted); margin-top: 2px; }

    /* ── Summary card right ────────────────────────────── */
    .summary-card { height: 100%; }

    /* ── Completion ring ───────────────────────────────── */
    .completion-row {
      display: flex;
      align-items: center;
      gap: var(--space-6);
    }
    .ring-chart {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }
    .ring-chart svg { transform: rotate(-90deg); }
    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--color-ink);
    }
    .checklist { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 13px;
    }
    .check-icon { flex-shrink: 0; }
    .check-done  { color: var(--color-success); }
    .check-warn  { color: var(--color-warning); }
    .check-empty { color: var(--color-disabled); }
    .checklist-studio { font-weight: 500; flex: 1; }
    .checklist-note { font-size: 12px; color: var(--color-muted); }

    /* ── Governance status strip ───────────────────────── */
    .gov-strip { display: flex; flex-direction: column; gap: 8px; }
    .gov-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: 13px;
    }
    .gov-icon { flex-shrink: 0; }
    .gov-gate { font-weight: 500; min-width: 120px; }
    .gov-detail { color: var(--color-muted); font-size: 12px; }

    /* ── Studio cards (Tab 2) ──────────────────────────── */
    .studio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }
    .studio-card {
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      box-shadow: var(--shadow-sm);
      transition: box-shadow .15s;
    }
    .studio-card:hover { box-shadow: var(--shadow-md); }
    .studio-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .studio-icon-wrap {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      background: var(--color-brand-light);
      color: var(--color-brand);
      flex-shrink: 0;
    }
    .studio-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .studio-summary { font-size: 13px; color: var(--color-muted); }
    .studio-badge-complete  { background:#DCFCE7; color:var(--color-success); }
    .studio-badge-partial   { background:#FEF3C7; color:var(--color-warning); }
    .studio-badge-missing   { background:#F1F5F9; color:var(--color-muted); }

    /* ── Approval chain stepper ────────────────────────── */
    .approval-chain {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-5) var(--space-6);
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      margin-bottom: var(--space-6);
      overflow-x: auto;
      gap: 0;
    }
    .approval-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 90px;
    }
    .approval-circle {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      border: 2px solid var(--color-border);
      background: var(--color-panel);
    }
    .approval-circle.done { background: var(--color-success); border-color: var(--color-success); color:#fff; }
    .approval-circle.pending { background: #FEF3C7; border-color: var(--color-warning); color: var(--color-warning); }
    .approval-circle.rejected{ background: #FEE2E2; border-color: var(--color-danger); color: var(--color-danger); }
    .approval-circle.final { background: var(--color-brand); border-color: var(--color-brand); color:#fff; }
    .approval-node-label { font-size: 11px; font-weight: 500; color: var(--color-muted); text-align: center; max-width: 80px; }
    .approval-connector { flex: 1; height: 2px; background: var(--color-border); min-width: 20px; }
    .approval-connector.done { background: var(--color-success); }

    /* ── Diff view ─────────────────────────────────────── */
    .diff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-3); }
    .diff-col { padding: var(--space-4); font-size: 13px; }
    .diff-col-a { background: #FEF2F2; border-right: 1px solid var(--color-border); }
    .diff-col-b { background: #F0FDF4; }
    .diff-col-header { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--color-muted); margin-bottom: var(--space-2); }
    .diff-removed { color: var(--color-danger); text-decoration: line-through; }
    .diff-added   { color: var(--color-success); font-weight: 500; }

    /* ── Simulation result ─────────────────────────────── */
    .sim-result-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .sim-result-header {
      background: var(--color-surface);
      padding: var(--space-4) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border);
    }
    .sim-metric {
      text-align: center;
      padding: var(--space-5);
    }
    .sim-metric-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .sim-metric-label { font-size: 12px; color: var(--color-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .3px; }
    .sim-metrics-grid { display: grid; grid-template-columns: repeat(4,1fr); border-top: 1px solid var(--color-border); }
    .sim-metrics-grid .sim-metric + .sim-metric { border-left: 1px solid var(--color-border); }

    /* ── Audit log table scoped ────────────────────────── */
    .audit-action-badge {
      display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
      font-size: 11px; font-weight: 600; border-radius: var(--radius-sm);
      text-transform: uppercase;
    }

    /* ── Read-only banner ──────────────────────────────── */
    .readonly-banner {
      background: var(--color-brand-light);
      border: 1px solid var(--color-brand);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--color-brand);
      margin-bottom: var(--space-5);
    }

    /* ── Version compare selector ─────────────────────── */
    .compare-selector { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-4); align-items: end; margin-bottom: var(--space-6); }

    /* ── Overview detail grid ──────────────────────────── */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5) var(--space-8); }
    .detail-field label { display: block; font-size: 12px; font-weight: 500; color: var(--color-muted); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 4px; }
    .detail-field .field-value { font-size: 14px; color: var(--color-ink); }
    .detail-field .field-value.mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .jurisdiction-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .jur-chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 100px; font-size: 12px; font-weight: 500; }
    .dirty-banner {
      background: #FFFBEB; border: 1px solid var(--color-warning);
      border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--color-warning); margin-bottom: var(--space-4);
    }
  </style>
</head>

              <span class="badge badge-${ver.status} badge-lg" role="status">${PS.statusLabel(ver.status)}</span>
            </div>
            ${ver.from ? `<div style="font-size:13px;color:var(--color-muted);margin-top:4px">Effective: ${ver.from} → ${ver.to||'Open-ended'}</div>` : '<div style="font-size:13px;color:var(--color-muted);margin-top:4px">Effective dates not yet set</div>'}

                  stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>

      ${['overview','studios','simulation','versions','governance','audit'].map(t => `
      <button class="tab-btn ${activeTab===t?'active':''}" id="tab-${t}" onclick="switchTab('${t}')" role="tab" aria-selected="${activeTab===t}">${tabLabel(t)}</button>`).join('')}

function tabLabel(t) {
  return {overview:'Overview',studios:'Studios',simulation:'Simulation',versions:'Versions',governance:'Governance',audit:'Audit'}[t]||t;
}

/* ──────────────────────────────────────────────────────────
   TAB SWITCHING
────────────────────────────────────────────────────────── */
function switchTab(tab) {
  if (dirtyState && !confirm('You have unsaved changes. Leave this tab?')) return;
  dirtyState = false; editMode = false;
  activeTab = tab;
  history.replaceState(null,'',`#${tab}`);
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.id===`tab-${tab}`);
    b.setAttribute('aria-selected', b.id===`tab-${tab}`);
  });
  renderTab(tab);
}

function renderTab(tab) {
  const content = document.getElementById('tab-content');
  if (!content) return;
  if (tab==='overview')    renderOverview(content);
  else if (tab==='studios')     renderStudios(content);
  else if (tab==='simulation')  renderSimulation(content);
  else if (tab==='versions')    renderVersionsTab(content);
  else if (tab==='governance')  renderGovernance(content);
  else if (tab==='audit')       renderAudit(content);
}

          : `<p style="font-size:14px;line-height:22px;color:var(--color-muted)">${p.notes}</p>`}

function detailField(label, value, isMono, id, type='text', opts=[]) {
  const mono = isMono ? ' mono' : '';
  if (!editMode) {
    return `<div class="detail-field"><label>${label}</label><div class="field-value${mono}">${value}</div></div>`;
  }
  if (type==='select') {
    return `<div class="detail-field"><label>${label}</label>
      <select id="${id}" class="form-control" onchange="markDirty()" style="height:36px">
        ${opts.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
  }
  const systemGenerated = /internal code|system id/i.test(label);
  return `<div class="detail-field"><label>${label}</label>
    <input type="text" id="${id}" class="form-control" value="${value}" ${isMono?'style="font-family:monospace"':''} ${systemGenerated?'data-system-generated readonly aria-readonly="true"':'onchange="markDirty()"'}>
    ${systemGenerated?'<span class="form-help">System generated. Cannot be changed.</span>':''}</div>`;
}

function toggleEditMode() {
  editMode = !editMode;
  renderOverview(document.getElementById('tab-content'));
}
function cancelEdit() { editMode=false; dirtyState=false; renderOverview(document.getElementById('tab-content')); }
function markDirty() { dirtyState=true; const b=document.getElementById('dirty-banner'); if(b) b.classList.remove('hidden'); }
function saveOverview() {
  const name = document.getElementById('w-name-edit')?.value;
  if (name) currentProduct.name = name;
  editMode=false; dirtyState=false;
  renderPage();
  PS.actionResult('success','Changes saved','Product details updated successfully.');
}

function renderGovernance(el) {
  const p = currentProduct;
  const gateNames = ['Product Owner','Actuarial','Underwriting','Compliance','Ops/Tech'];

  // Build approval chain
  const approvedCount = p.governance.filter(g=>g.action==='Approved').length;
  const chainHTML = p.governance.map((g,i) => {
    const isDone = g.action==='Approved';
    const isPend = g.action==='Pending';
    const isRej  = g.action==='Rejected';
    const circCls = isDone?'done':isPend?'pending':isRej?'rejected':'';
    const icon = isDone?'✓':isPend?'⏳':isRej?'✕':(i+1);
    const connCls = isDone?'done':'';
    return `
      <div class="approval-node">
        <div class="approval-circle ${circCls}">${icon}</div>
        <div class="approval-node-label">${g.gate}</div>
      </div>
      ${i<p.governance.length-1 ? `<div class="approval-connector ${connCls}"></div>` : ''}`;
  }).join('') + `
    <div class="approval-connector ${approvedCount===5?'done':''}"></div>
    <div class="approval-node">
      <div class="approval-circle ${approvedCount===5?'final':''}">🚀</div>
      <div class="approval-node-label">Published</div>
    </div>`;

  const isPublished = p.status==='published';

  el.innerHTML = `
    <div class="approval-chain" role="group" aria-label="Approval pipeline">${chainHTML}</div>

    <div class="card mb-5">
      <div class="card-header"><div class="card-title">Approval Gate Log</div></div>
      <div class="table-wrap">
        <table aria-label="Governance log">
          <thead>
            <tr><th>Gate</th><th>Approver</th><th class="text-center">Action</th><th>Date</th><th>Comments</th><th style="width:160px">Actions</th></tr>
          </thead>
          <tbody>
            ${p.governance.map((g,i) => {
              const isDone=g.action==='Approved', isPend=g.action==='Pending', isRej=g.action==='Rejected';
              const actColor=isDone?'var(--color-success)':isPend?'var(--color-warning)':'var(--color-danger)';
              const actBg=isDone?'#DCFCE7':isPend?'#FEF3C7':'#FEE2E2';
              return `<tr>
                <td style="font-weight:500">${g.gate}</td>
                <td style="font-size:13px">${g.approver}</td>
                <td class="text-center">
                  <span style="display:inline-flex;height:20px;padding:0 8px;border-radius:4px;font-size:11px;font-weight:600;align-items:center;background:${actBg};color:${actColor};text-transform:uppercase">${g.action}</span>
                </td>
                <td style="font-size:13px">${g.date}</td>
                <td style="font-size:13px;color:var(--color-muted);max-width:220px">${g.comment}</td>
                <td>
                  ${isPend && !isPublished ? `
                  <div class="table-actions">
                    <button class="btn btn-primary btn-sm" onclick="approveGate(${i})">Approve</button>
                    <button class="btn btn-danger btn-sm" onclick="rejectGate(${i})">Reject</button>
                    <button class="btn btn-ghost btn-sm" onclick="commentGate(${i})">Comment</button>
                  </div>` : ''}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    ${(p.status==='approved') ? `
    <div class="card">
      <div class="card-header"><div class="card-title">Schedule Publication</div></div>
      <div class="card-body">
        <div style="display:flex;gap:var(--space-5);align-items:flex-end">
          <div class="form-group" style="margin:0;flex:1">
            <label class="form-label" for="pub-date">Publication Date & Time</label>
            <input type="datetime-local" id="pub-date" class="form-control">
          </div>
          <button class="btn btn-primary" onclick="schedulePublication()">Schedule Publication</button>
          <button class="btn btn-danger" onclick="publishNow()">Publish Now</button>
        </div>
        <span class="form-help" style="margin-top:8px;display:block">Publisher role required. Publication will make this version live immediately.</span>
      </div>
    </div>` : ''}`;
}

function approveGate(i) {
  PS.openModal(`
    <div class="modal-header"><h2 class="modal-title">Approve Gate: ${currentProduct.governance[i].gate}</h2>
      <button class="btn btn-icon" onclick="PS.closeModal()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 256 256" fill="none"><path d="M205.66 194.34a8 8 0 01-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 01-11.32-11.32L116.69 128 50.34 61.66a8 8 0 0111.32-11.32L128 116.69l66.34-66.35a8 8 0 0111.32 11.32L139.31 128z" fill="currentColor"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="callout callout-success" style="margin-bottom:var(--space-4)"><div class="callout-body">You are approving the <strong>${currentProduct.governance[i].gate}</strong> gate for <strong>${currentProduct.name} v${activeVersion}</strong>.</div></div>
      <div class="form-group"><label class="form-label" for="approve-comment">Approval Comments (optional)</label>
        <textarea id="approve-comment" class="form-control" rows="3" placeholder="Add your approval rationale…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="PS.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="executeApprove(${i})">Confirm Approval</button>
    </div>
  `, 'modal-sm');
}
function executeApprove(i) {
  const comment = document.getElementById('approve-comment')?.value || 'Approved.';
  currentProduct.governance[i].action = 'Approved';
  currentProduct.governance[i].approver = PS.data.currentUser.name;
  currentProduct.governance[i].date = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');
  currentProduct.governance[i].comment = comment;
  PS.closeModal();
  PS.actionResult('success','Gate approved',`${currentProduct.governance[i].gate} gate approved.`);
  renderGovernance(document.getElementById('tab-content'));
}
function rejectGate(i)  { PS.actionResult('warning','Gate rejected',`${currentProduct.governance[i].gate} gate rejected.`); }
function commentGate(i) { PS.actionResult('info','Comment added','Your comment has been added to the governance log.'); }
function schedulePublication() { PS.actionResult('success','Publication scheduled','Product will go live at the scheduled date and time.'); }
function publishNow() { PS.actionResult('success','Product published',`${currentProduct.name} v${activeVersion} is now live.`); }

  "productId": "${p.id}",
  "version": "${activeVersion}",
  "risk": {
    "jurisdiction": "IN",
    "driverAge": 32,
    "vehicleAge": 3,
    "insuredValue": 25000

}</pre>
        </div>

  "status": "ELIGIBLE",
  "quoteId": "QTE-2026-88192",
  "currency": "INR",

}</pre>
        </div>
      </div>
      <div style="margin-top:var(--space-4);font-size:12px;color:var(--color-muted)">
        For full interactive monitoring and logs, see <a href="integration-monitor.html" style="color:var(--color-brand);font-weight:500">Integration Monitor →</a>

    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="window.location.href='integration-monitor.html'">Open Integration Monitor</button>
      <button class="btn btn-primary" onclick="PS.closeModal()">Done</button>
    </div>
  `, 'modal-lg');
}

/* ──────────────────────────────────────────────────────────
   VERSION SWITCHING
────────────────────────────────────────────────────────── */
function switchVersion(label) {
  activeVersion = label;
  history.replaceState(null,'',`?id=${currentProduct.id}&version=${label}#${activeTab}`);
  renderPage();
  setTimeout(()=>switchTab(activeTab), 0);
}

/* ──────────────────────────────────────────────────────────
   DROPDOWN HELPER
────────────────────────────────────────────────────────── */
function toggleDD(id) {
  const menu = document.getElementById(id);
  if (!menu) return;
  const isH = menu.classList.contains('hidden');
  document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.add('hidden'));
  if (isH) menu.classList.remove('hidden');
}
function setupDropdownClose() {
  document.addEventListener('click', e => {
    if (!e.target.closest('.dropdown') && !e.target.closest('[onclick*="toggleDD"]')) {
      document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.add('hidden'));
    }
  }, {once:false});
}

/* Spin keyframe for simulation button */
const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
document.head.appendChild(styleEl);
</script>
