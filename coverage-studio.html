<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coverage Studio — Product Studio | VeriDex</title>
  <meta name="description" content="Configure covers, limits, deductibles, exclusions and financial terms for a product version.">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ── Studio two-panel shell ────────────────────────── */
    .studio-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-5);
      align-items: start;
    }

    /* ── Cover sidebar ─────────────────────────────────── */
    .cover-sidebar { position: sticky; top: calc(56px + var(--space-6)); }
    .cover-list { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2); }
    .cover-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: 10px var(--space-4);
      border-radius: var(--radius-md);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .1s, border-color .1s;
    }
    .cover-item:hover { background: var(--color-surface); }
    .cover-item.active {
      background: var(--color-brand-light);
      border-left-color: var(--color-brand);
    }
    .cover-item-left { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; }
    .cover-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cover-item.active .cover-item-name { color: var(--color-brand); }
    .cover-warn { color: var(--color-warning); font-size: 13px; }

    /* Availability micro-badges */
    .avail-badge {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .avail-mandatory  { background: #EBF1FA; color: var(--color-brand); }
    .avail-optional   { background: #F1F5F9; color: var(--color-muted); }
    .avail-default    { background: #DCFCE7; color: var(--color-success); }
    .avail-addon      { background: #F3E8FF; color: #7C3AED; }

    /* ── Detail panel ──────────────────────────────────── */
    .detail-panel { display: flex; flex-direction: column; gap: var(--space-4); }

    /* ── Section accordion ─────────────────────────────── */
    .section-card {
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      cursor: pointer;
      user-select: none;
      transition: background .1s;
    }
    .section-header:hover { background: var(--color-surface); }
    .section-header-left { display: flex; align-items: center; gap: var(--space-3); }
    .section-number {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--color-brand-light);
      color: var(--color-brand);
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-title { font-size: 14px; font-weight: 600; }
    .section-subtitle { font-size: 12px; color: var(--color-muted); margin-top: 1px; }
    .section-chevron {
      color: var(--color-muted);
      transition: transform .2s;
    }
    .section-chevron.open { transform: rotate(90deg); }
    .section-body {
      border-top: 1px solid var(--color-border);
      overflow: hidden;
      max-height: 0;
      transition: max-height .25s ease;
    }
    .section-body.open { max-height: 8000px; }
    .section-inner { padding: var(--space-5) var(--space-6); }
    .section-footer {
      padding: var(--space-3) var(--space-6);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      background: var(--color-surface);
    }

    /* ── Form layout helpers ───────────────────────────── */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4) var(--space-5); }
    .span-2 { grid-column: 1 / -1; }

    /* ── Radio group ───────────────────────────────────── */
    .radio-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .radio-option {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: border-color .1s, background .1s;
      font-size: 13px;
    }
    .radio-option:hover { border-color: var(--color-brand); background: var(--color-brand-light); }
    .radio-option.selected { border-color: var(--color-brand); background: var(--color-brand-light); }
    .radio-option input[type="radio"] { accent-color: var(--color-brand); }

    /* ── Currency input ─────────────────────────────────── */
    .currency-wrap { position: relative; }
    .currency-prefix {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px; font-weight: 600; color: var(--color-muted);
      pointer-events: none;
    }
    .currency-input { padding-left: 36px; font-family: 'IBM Plex Mono', monospace; }

    /* ── Toggle switch ──────────────────────────────────── */
    .toggle-wrap {
      display: flex; align-items: center; gap: var(--space-3);
      font-size: 13px;
    }
    .toggle-switch {
      position: relative; width: 40px; height: 22px; display: inline-block;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--color-disabled);
      border-radius: 11px; cursor: pointer; transition: .2s;
    }
    .toggle-dot {
      position: absolute; left: 2px; top: 2px;
      width: 18px; height: 18px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--color-brand); }
    .toggle-switch input:checked ~ .toggle-dot,
    .toggle-switch input:checked + .toggle-slider + .toggle-dot { transform: translateX(18px); }

    /* ── Dependency / constraint table ─────────────────── */
    .dep-table { width: 100%; border-collapse: collapse; margin-bottom: var(--space-3); }
    .dep-table th {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .4px; color: var(--color-muted);
      padding: var(--space-2) var(--space-3); text-align: left;
      border-bottom: 1px solid var(--color-border);
    }
    .dep-table td {
      padding: var(--space-2) var(--space-3);
      font-size: 13px;
      border-bottom: 1px solid var(--color-border);
    }
    .dep-table tr:last-child td { border-bottom: none; }
    .dep-table select, .dep-table input { height: 30px; font-size: 13px; }

    /* ── Wording doc row ────────────────────────────────── */
    .doc-row {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-2);
      background: var(--color-surface);
    }
    .doc-row-icon { color: var(--color-brand); flex-shrink: 0; }
    .doc-row-name { font-size: 13px; font-weight: 500; flex: 1; }
    .doc-row-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--color-muted); }
    .doc-row-ver  { font-size: 12px; color: var(--color-muted); }

    /* ── Read-only banner ────────────────────────────────── */
    .readonly-band {
      background: var(--color-brand-light);
      border: 1px solid rgba(26,79,138,.2);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-5);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--color-brand);
      margin-bottom: var(--space-5);
    }

    /* ── Library table ───────────────────────────────────── */
    .lib-table { width: 100%; border-collapse: collapse; }
    .lib-table th {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
      color: var(--color-muted); padding: var(--space-2) var(--space-4); text-align: left;
      border-bottom: 1px solid var(--color-border); background: var(--color-surface);
    }
    .lib-table td { padding: var(--space-3) var(--space-4); font-size: 13px; border-bottom: 1px solid var(--color-border); }
    .lib-table tr:last-child td { border-bottom: none; }
    .lib-table tr:hover td { background: var(--color-surface); }

    /* ── Constraint badge operator ───────────────────────── */
    .op-badge {
      display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; color: var(--color-brand); font-weight: 600;
    }

    /* ── Studio context bar ──────────────────────────────── */
    .studio-context-bar {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-3) var(--space-5);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-5);
      font-size: 13px;
    }
    .studio-context-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px;
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: 100px;
      font-size: 12px; font-weight: 500;
    }

    /* ── Modular insured item terms ─────────────────────── */
    .item-term-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-surface);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
    }
    .item-term-header { display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4); }
    .item-term-title { font-size:14px;font-weight:600; }
    .choice-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2); }
    .choice-chip {
      display:flex;align-items:center;gap:var(--space-2);padding:9px var(--space-3);
      border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-panel);
      font-size:12px;cursor:pointer;
    }
    .choice-chip:has(input:checked){border-color:var(--color-brand);background:var(--color-brand-light);color:var(--color-brand);font-weight:600;}
    .term-flow { display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--color-muted); }
    .term-flow-step { padding:4px 8px;border-radius:100px;background:var(--color-brand-light);color:var(--color-brand);font-weight:600; }
    .authority-grid { display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3); }
    .authority-row { display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);padding:var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface); }
    .authority-label { font-size:13px;font-weight:600; }
    .authority-help { font-size:12px;color:var(--color-muted);margin-top:2px; }
    @media(max-width:1100px){.choice-grid,.authority-grid{grid-template-columns:1fr 1fr!important}}
  </style>
</head>

function makeInsuredItem(partial = {}) {
  const defaultValuationBasis = partial.defaultValuationBasis || partial.basisOfCoverage || 'Market Value';
  const allowed = Array.isArray(partial.allowedValuationBases) && partial.allowedValuationBases.length
    ? partial.allowedValuationBases
    : defaultValuationBasis === 'Not Applicable'
      ? ['Not Applicable']
      : [defaultValuationBasis];
  return Object.assign({
    id:`ITEM-${Date.now()}-${Math.floor(Math.random() * 10000)}`,
    name:'Primary insured item',
    type:'Other',
    allowedValuationBases:allowed,
    defaultValuationBasis,
    quoteValuationSelection:'Product default only',
    underwriterValuationOverride:false,
    limitBasis:'fixed',
    limitAmount:'',
    limitPercentage:'100',
    limitReference:'Declared Value',
    limitFormula:'100% of Declared Value',
    underwriterLimitOverride:false
  }, partial, { allowedValuationBases:allowed, defaultValuationBasis });
}

function defaultItemsForLine(lineOfBusiness, coverName) {
  if (lineOfBusiness === 'Property') return [
    makeInsuredItem({ name:'Building', type:'Building', allowedValuationBases:['Reinstatement Cost','Agreed Value'], defaultValuationBasis:'Reinstatement Cost', quoteValuationSelection:'Customer / agent may choose', limitBasis:'formula', limitFormula:'100% of Reinstatement Cost', limitReference:'Reinstatement Cost', underwriterValuationOverride:true, underwriterLimitOverride:true }),
    makeInsuredItem({ name:'Equipment', type:'Equipment / Machinery', allowedValuationBases:['Agreed Value','Market Value','Reinstatement Cost'], defaultValuationBasis:'Agreed Value', quoteValuationSelection:'Customer / agent may choose', limitBasis:'fixed', limitAmount:'250,000', underwriterValuationOverride:true, underwriterLimitOverride:true }),
    makeInsuredItem({ name:'Stock', type:'Stock / Inventory', allowedValuationBases:['Market Value','Agreed Value'], defaultValuationBasis:'Market Value', quoteValuationSelection:'Customer / agent may choose', limitBasis:'percentage', limitPercentage:'80', limitReference:'Declared Value', underwriterValuationOverride:true, underwriterLimitOverride:true })
  ];
  if (lineOfBusiness === 'Trucking') return [
    makeInsuredItem({ name:'Truck / tractor', type:'Tractor / Prime Mover', allowedValuationBases:['Agreed Value','Market Value'], defaultValuationBasis:'Market Value', quoteValuationSelection:'Customer / agent may choose', limitBasis:'percentage', limitPercentage:'100', limitReference:'Vehicle Value', underwriterValuationOverride:true, underwriterLimitOverride:true }),
    makeInsuredItem({ name:'Attached trailer', type:'Trailer', allowedValuationBases:['Agreed Value','Market Value'], defaultValuationBasis:'Agreed Value', quoteValuationSelection:'Product default only', limitBasis:'fixed', limitAmount:'75,000', underwriterValuationOverride:true, underwriterLimitOverride:true })
  ];
  if (lineOfBusiness === 'Cyber') return [
    makeInsuredItem({ name:'Network and systems', type:'Network / Systems', allowedValuationBases:['Not Applicable'], defaultValuationBasis:'Not Applicable', limitBasis:'fixed', limitAmount:'1,000,000', underwriterLimitOverride:true }),
    makeInsuredItem({ name:'Cyber business income', type:'Cyber Business Income', allowedValuationBases:['Not Applicable'], defaultValuationBasis:'Not Applicable', limitBasis:'formula', limitFormula:'90 days of verified gross profit loss', limitReference:'Annual Revenue', underwriterLimitOverride:true })
  ];
  if (lineOfBusiness === 'Workers Compensation') return [
    makeInsuredItem({ name:'Covered employees', type:'Employee / Worker', allowedValuationBases:['Not Applicable'], defaultValuationBasis:'Not Applicable', limitBasis:'formula', limitFormula:'Statutory benefits per applicable workers compensation law', limitReference:'Annual Payroll', underwriterLimitOverride:false })
  ];
  return [makeInsuredItem({
    name:coverName || 'Primary insured item',
    type:'Vehicle',
    allowedValuationBases:['Agreed Value','Market Value'],
    defaultValuationBasis:'Market Value',
    quoteValuationSelection:'Customer / agent may choose',
    limitBasis:'fixed',
    underwriterValuationOverride:true,
    underwriterLimitOverride:true
  })];
}

function createCoverageDefaults(partial = {}) {
  const lineOfBusiness = partial.lineOfBusiness || 'Motor';
  const items = partial.insuredItems || defaultItemsForLine(lineOfBusiness, partial.name);
  return Object.assign({
    id:`COV-${String(Date.now()).slice(-6)}`,
    name:'New Cover', code:`COV-${String(Date.now()).slice(-5)}`,
    availability:'optional', complete:false, type:'First Party — Property Damage',
    description:'', lineOfBusiness, insuredItems:items,
    deductibleType:'none', deductibleAmount:'', deductiblePct:'', deductiblePercentageBasis:'Claim Amount',
    minDeductible:'', maxDeductible:'', copay:'0', waitingPeriod:'None',
    subLimits:[], annualAggregate:false, aggregateBasis:'fixed', aggregateAmount:'', aggregatePercentage:'100', aggregateReference:'Declared Value', aggregateFormula:'',
    underwriterDeductibleOverride:false, underwriterAggregateOverride:false,
    underwriterAvailabilityOverride:false, underwriterConstraintOverride:false,
    overrideRequiresReferral:true, overrideReasonRequired:true, overrideMaxPercent:'20',
    defaultSelected:false, mutualExclusions:[], conditionalOn:'', dependencies:[], constraints:[],
    lossBasis:'Per Occurrence', reinstatement:'Automatic (full limit)', benefitBasis:'Indemnity',
    claimsNotifPeriod:'14', claimsNotifUnit:'days', wordingDocs:[]
  }, partial, { insuredItems:items });
}

function normalizeCoverageModel(c) {
  if (!c.lineOfBusiness) c.lineOfBusiness = PS.prototypeApp?.productById(productId)?.family || 'Motor';
  if (!Array.isArray(c.insuredItems) || !c.insuredItems.length) {
    const notApplicable = !c.sumInsured && /service|liability/i.test(`${c.type} ${c.name}`);
    const defaultValuationBasis = notApplicable ? 'Not Applicable' : (c.basisOfCoverage || 'Market Value');
    const allowedValuationBases = notApplicable
      ? ['Not Applicable']
      : /property|damage|glass/i.test(`${c.type} ${c.name}`)
        ? [...new Set([defaultValuationBasis,'Agreed Value','Market Value','Reinstatement Cost'])].filter(v => v !== 'Not Applicable')
        : [defaultValuationBasis];
    c.insuredItems = [makeInsuredItem({
      name:c.name === 'Own Damage' ? 'Insured vehicle' : c.name,
      type:/vehicle|damage|glass|roadside|theft/i.test(`${c.type} ${c.name}`) ? 'Vehicle' : notApplicable ? 'Third Party' : 'Other',
      allowedValuationBases,
      defaultValuationBasis,
      quoteValuationSelection:allowedValuationBases.length > 1 ? 'Customer / agent may choose' : 'Product default only',
      underwriterValuationOverride:!notApplicable,
      limitBasis:c.sumInsured ? 'fixed' : 'none',
      limitAmount:c.sumInsured || '',
      limitPercentage:'100',
      limitReference:defaultValuationBasis === 'Reinstatement Cost' ? 'Reinstatement Cost' : 'Declared Value',
      limitFormula:defaultValuationBasis === 'Reinstatement Cost' ? '100% of Reinstatement Cost' : '100% of Declared Value',
      underwriterLimitOverride:!notApplicable
    })];
  } else {
    c.insuredItems = c.insuredItems.map(item => makeInsuredItem(item));
  }
  if (!Array.isArray(c.subLimits)) c.subLimits = c.subLimit ? [{ name:'General sub-limit', basis:'fixed', amount:c.subLimit, percentage:'', reference:'Declared Value', formula:'' }] : [];
  c.subLimits = c.subLimits.map(sub => Object.assign({ name:'Sub-limit', basis:'fixed', amount:'', percentage:'', reference:'Declared Value', formula:'' }, sub));
  if (!c.aggregateBasis) c.aggregateBasis = 'fixed';
  if (c.aggregateAmount === undefined) c.aggregateAmount = c.annualAggregate ? (c.maxSingleLimit || '') : '';
  if (c.aggregatePercentage === undefined) c.aggregatePercentage = '100';
  if (!c.aggregateReference) c.aggregateReference = 'Declared Value';
  if (c.aggregateFormula === undefined) c.aggregateFormula = '';
  if (c.deductiblePercentageBasis === undefined) c.deductiblePercentageBasis = 'Claim Amount';
  if (c.underwriterDeductibleOverride === undefined) c.underwriterDeductibleOverride = false;
  if (c.underwriterAggregateOverride === undefined) c.underwriterAggregateOverride = false;
  if (c.underwriterAvailabilityOverride === undefined) c.underwriterAvailabilityOverride = false;
  if (c.underwriterConstraintOverride === undefined) c.underwriterConstraintOverride = false;
  if (c.overrideRequiresReferral === undefined) c.overrideRequiresReferral = true;
  if (c.overrideReasonRequired === undefined) c.overrideReasonRequired = true;
  if (c.overrideMaxPercent === undefined) c.overrideMaxPercent = '20';
  if (!Array.isArray(c.mutualExclusions)) c.mutualExclusions = [];
  if (!Array.isArray(c.dependencies)) c.dependencies = [];
  if (!Array.isArray(c.constraints)) c.constraints = [];
  return c;
}

function loadCover(id) {
  activeCoverId = id;

  document.querySelectorAll('.cover-item').forEach(el => el.classList.remove('active'));

function esc(value) {
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleControl(field, checked, ro, itemIndex = null) {
  const itemAttr = itemIndex === null ? `data-cover-field="${field}"` : `data-item-field="${field}" data-item-index="${itemIndex}"`;
  return `<label class="toggle-switch">
    <input type="checkbox" ${itemAttr} ${checked?'checked':''} ${ro?'disabled':''}>
    <div class="toggle-slider"></div><div class="toggle-dot"></div>
  </label>`;
}

function boundText(label, field, value, ro, placeholder = '', itemIndex = null) {
  const attrs = itemIndex === null ? `data-cover-field="${field}"` : `data-item-field="${field}" data-item-index="${itemIndex}"`;
  return `<div class="form-group"><label class="form-label">${label}</label>
    <input type="text" class="form-control" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs} ${ro?'readonly':''}>
  </div>`;
}

function boundSelect(label, field, value, options, ro, booleanMode = false, itemIndex = null, labels = null) {
  const attrs = itemIndex === null ? `data-cover-field="${field}"` : `data-item-field="${field}" data-item-index="${itemIndex}"`;
  return `<div class="form-group"><label class="form-label">${label}</label>
    <select class="form-control" ${attrs} ${booleanMode?'data-boolean-select="true"':''} ${ro?'disabled':''}>
      ${options.map(option => `<option value="${esc(option)}" ${option===value?'selected':''}>${esc(labels?.[option] || option)}</option>`).join('')}
    </select>
  </div>`;
}

function formatDeductibleSummary(c) {

  return `${c.deductiblePct || '0'}% of ${c.deductiblePercentageBasis}`;
}

function formatAuthoritySummary(c) {
  const itemPermissions = c.insuredItems.reduce((count,item) => count + Number(item.underwriterValuationOverride) + Number(item.underwriterLimitOverride), 0);
  const coveragePermissions = ['underwriterDeductibleOverride','underwriterAggregateOverride','underwriterAvailabilityOverride','underwriterConstraintOverride'].filter(field => c[field]).length;
  const count = itemPermissions + coveragePermissions;
  return count ? `${count} override permission${count===1?'':'s'} enabled` : 'No override permissions';
}

function handleCoverageFieldChange(event) {
  const el = event.target;
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  let rerender = false;
  if (el.dataset.itemArrayField) {
    const item = c.insuredItems[Number(el.dataset.itemIndex)];
    const field = el.dataset.itemArrayField;
    const values = new Set(item[field] || []);
    el.checked ? values.add(el.value) : values.delete(el.value);
    if (!values.size) { values.add(el.value); el.checked = true; }
    item[field] = [...values];
    if (!item[field].includes(item.defaultValuationBasis)) item.defaultValuationBasis = item[field][0];
    rerender = event.type === 'change';
  } else if (el.dataset.itemField) {
    const item = c.insuredItems[Number(el.dataset.itemIndex)];
    if (!item) return;
    item[el.dataset.itemField] = el.type === 'checkbox' ? el.checked : normalizeLimitBasis(el.dataset.itemField, el.value);
    rerender = event.type === 'change' && ['limitBasis','defaultValuationBasis','underwriterValuationOverride','underwriterLimitOverride'].includes(el.dataset.itemField);
  } else if (el.dataset.sublimitField) {
    const sub = c.subLimits[Number(el.dataset.sublimitIndex)];
    if (!sub) return;
    if (el.dataset.sublimitField === 'basis') { sub.basis = el.value; rerender = true; }
    else if (el.dataset.sublimitField === 'displayValue') {
      if (sub.basis === 'fixed') sub.amount = el.value;
      else if (sub.basis === 'percentage') sub.percentage = el.value.replace(/[^0-9.]/g,'');
      else sub.formula = el.value;
    } else sub[el.dataset.sublimitField] = el.value;
  } else if (el.dataset.dependencyField) {
    const dependency = c.dependencies[Number(el.dataset.dependencyIndex)];
    if (dependency) dependency[el.dataset.dependencyField] = el.value;
  } else if (el.dataset.constraintField) {
    const constraint = c.constraints[Number(el.dataset.constraintIndex)];
    if (constraint) constraint[el.dataset.constraintField] = el.value;
  } else if (el.dataset.coverField) {
    const field = el.dataset.coverField;
    let value = el.multiple ? [...el.selectedOptions].map(option => option.value).filter(Boolean) : el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.booleanSelect === 'true') value = /required$/i.test(value);
    value = normalizeLimitBasis(field,value);
    c[field] = value;
    rerender = event.type === 'change' && ['deductibleType','annualAggregate','aggregateBasis','underwriterDeductibleOverride','underwriterAggregateOverride','underwriterAvailabilityOverride','underwriterConstraintOverride','availability','defaultSelected','conditionalOn','mutualExclusions','lossBasis','benefitBasis'].includes(field);
    if (event.type === 'change' && ['availability','name'].includes(field)) renderCoverList();
  }
  if (rerender) renderDetailPanel(c);
}

function normalizeLimitBasis(field, value) {
  if (!['limitBasis','aggregateBasis'].includes(field)) return value;
  return LIMIT_BASES.find(option => option.label === value)?.value || value;
}

function addInsuredItem() {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  c.insuredItems.push(makeInsuredItem({ name:`Insured item ${c.insuredItems.length + 1}`, type:'Other', allowedValuationBases:['Agreed Value','Market Value','Reinstatement Cost'], defaultValuationBasis:'Market Value', quoteValuationSelection:'Customer / agent may choose' }));
  renderDetailPanel(c);
}

function removeInsuredItem(index) {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c || c.insuredItems.length === 1) return;
  c.insuredItems.splice(index,1);
  renderDetailPanel(c);
}

function addSubLimit() {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  c.subLimits.push({ name:'New sub-limit', basis:'fixed', amount:'', percentage:'', reference:'Declared Value', formula:'' });
  renderDetailPanel(c);
}

function removeSubLimit(index) {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  c.subLimits.splice(index,1);
  renderDetailPanel(c);
}

function addDep() {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  const target = COVERS.find(cover => cover.id !== c.id);
  c.dependencies.push({ type:'Requires', dependsOn:target?.name || '', condition:'If selected' });
  renderDetailPanel(c);
}

function removeDep(index) {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  c.dependencies.splice(index,1);
  renderDetailPanel(c);
}

function addConstraint() {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  c.constraints.push({ field:'Risk field', operator:'is', value:'Value' });
  renderDetailPanel(c);
}

function removeConstraint(index) {
  const c = COVERS.find(cover => cover.id === activeCoverId);
  if (!c) return;
  c.constraints.splice(index,1);
  renderDetailPanel(c);
}

function buildSection(id, num, title, subtitle, content) {
  return `
  <div class="section-card">
    <div class="section-header" onclick="toggleSection('${id}')" aria-expanded="${openSections.has(id)}">
      <div class="section-header-left">
        <div class="section-number">${num}</div>
        <div>
          <div class="section-title">${title}</div>
          <div class="section-subtitle">${subtitle}</div>
        </div>
      </div>
      <svg class="section-chevron ${openSections.has(id)?'open':''}" id="sec-chev-${id}" width="16" height="16" viewBox="0 0 256 256" fill="none">
        <path d="M181.66 133.66l-80 80a8 8 0 01-11.32-11.32L164.69 128 90.34 53.66a8 8 0 0111.32-11.32l80 80a8 8 0 010 11.32z" fill="currentColor"/>
      </svg>
    </div>
    <div class="section-body ${openSections.has(id)?'open':''}" id="sec-body-${id}">
      <div class="section-inner">${content}</div>
    </div>
  </div>`;
}

function toggleSection(id) {
  const body = document.getElementById(`sec-body-${id}`);
  const chev = document.getElementById(`sec-chev-${id}`);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  if (isOpen) { body.classList.remove('open'); chev?.classList.remove('open'); openSections.delete(id); }
  else         { body.classList.add('open');    chev?.classList.add('open');    openSections.add(id); }
}

function fieldRow(label, value, mono=false, type='text', opts=[], readonly=false) {
  if (readonly) {
    return `<div class="form-group"><label class="form-label">${label}</label>
      <div class="field-value${mono?' mono':''}" style="font-size:14px;padding:6px 0">${value||'—'}</div>
    </div>`;
  }
  if (type === 'select') {
    return `<div class="form-group"><label class="form-label">${label}</label>
      <select class="form-control">${opts.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select>
    </div>`;
  }
  return `<div class="form-group"><label class="form-label">${label}</label>
    <input type="text" class="form-control" value="${value||''}" ${mono?'style="font-family:\'IBM Plex Mono\',monospace"':''} ${readonly?'readonly':''}>
  </div>`;
}

function formatFinancialSummary(c) {
  const valuations = [...new Set(c.insuredItems.map(item => item.defaultValuationBasis))];
  const valuation = valuations.length > 1 ? 'Mixed valuation' : valuations[0];
  return `${c.insuredItems.length} insured item${c.insuredItems.length===1?'':'s'} · ${valuation} · limits configured per item`;
}

function saveCover() {
  PS.actionResult('success', 'Cover saved', `"${COVERS.find(c=>c.id===activeCoverId)?.name}" has been saved.`);
}

          <label class="form-label" for="ac-lob">Line of Business <span class="required">*</span></label>
          <select id="ac-lob" class="form-control">
            ${PS.data.productFamilies.map(family => `<option ${family===(PS.prototypeApp?.productById(productId)?.family || 'Motor')?'selected':''}>${family}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="ac-avail">Availability <span class="required">*</span></label>
          <select id="ac-avail" class="form-control">
            <option value="mandatory">Mandatory</option>
            <option value="optional">Optional</option>
            <option value="default">Default-Selected</option>
            <option value="addon">Optional Add-on</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Start from Library Template?</label>
          <div class="toggle-wrap">
            <label class="toggle-switch" onclick="toggleLibPicker()">
              <input type="checkbox" id="ac-lib-toggle">
              <div class="toggle-slider"></div><div class="toggle-dot"></div>
            </label>
            <span>Use a template</span>
          </div>
        </div>
        <div class="form-group span-2" id="lib-picker-row" style="display:none">
          <label class="form-label">Library Template</label>
          <select class="form-control">
            <option>Own Damage — Standard (Motor)</option>
            <option>Personal Accident — Driver (Motor)</option>
            <option>Fire & Allied Perils (Property)</option>
            <option>Business Interruption — Standard (Property)</option>
            <option>Truck Physical Damage (Trucking)</option>
            <option>Motor Truck Cargo (Trucking)</option>
            <option>Network Security & Privacy Liability (Cyber)</option>
            <option>Cyber Incident Response (Cyber)</option>
            <option>Statutory Benefits (Workers Compensation)</option>
            <option>Employers Liability (Workers Compensation)</option>
          </select>
        </div>
        <div class="form-group span-2">
          <label class="form-label" for="ac-desc">Description</label>
          <textarea id="ac-desc" class="form-control" rows="3" placeholder="Brief description of what this cover includes…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="PS.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="executeAddCover()">Add Cover</button>
    </div>
  `);
}

function toggleLibPicker() {
  setTimeout(() => {
    const toggle = document.getElementById('ac-lib-toggle');
    const row = document.getElementById('lib-picker-row');
    if (row) row.style.display = toggle?.checked ? 'block' : 'none';
  }, 0);
}

function executeAddCover() {
  const name = document.getElementById('ac-name')?.value.trim();
  const type = document.getElementById('ac-type')?.value;
  if (!name || !type) { PS.actionResult('error','Required fields','Cover name and type are required.'); return; }
  PS.closeModal();
  PS.actionResult('success','Cover added',`"${name}" has been added. Configure it from the cover list.`);
}

/* ────────────────────────────────────────────────────────
   REORDER MODAL
──────────────────────────────────────────────────────── */
function openReorderModal() {
  PS.openModal(`
    <div class="modal-header">
      <h2 class="modal-title">Reorder Covers</h2>
      <button class="btn btn-icon" onclick="PS.closeModal()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="none"><path d="M205.66 194.34a8 8 0 01-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 01-11.32-11.32L116.69 128 50.34 61.66a8 8 0 0111.32-11.32L128 116.69l66.34-66.35a8 8 0 0111.32 11.32L139.31 128z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--color-muted);margin-bottom:var(--space-4)">Drag and drop covers to reorder them. Order affects how they appear on policy documents and quote screens.</p>
      <div style="display:flex;flex-direction:column;gap:var(--space-2)" id="reorder-list">
        ${COVERS.map((c,i) => `
        <div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-panel);cursor:grab">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="none" style="color:var(--color-muted)"><path d="M108 60a16 16 0 1116-16 16 16 0 01-16 16zm40 0a16 16 0 1116-16 16 16 0 01-16 16zm-40 80a16 16 0 1116-16 16 16 0 01-16 16zm40 0a16 16 0 1116-16 16 16 0 01-16 16zm-40 80a16 16 0 1116-16 16 16 0 01-16 16zm40 0a16 16 0 1116-16 16 16 0 01-16 16z" fill="currentColor"/></svg>
          <span style="font-size:13px;font-weight:500;flex:1">${c.name}</span>
          <span class="avail-badge ${AVAIL_CSS[c.availability]}">${AVAIL_LABELS[c.availability]}</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="PS.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCoverOrder()">Save Order</button>
    </div>
  `, 'modal-sm');
}

/* ────────────────────────────────────────────────────────
   COVER LIBRARY MODAL
──────────────────────────────────────────────────────── */
function openLibraryModal() {
  const libraryCovers = [
    { name:'Own Damage — Standard',      type:'First Party Property', lob:'Motor',    updated:'Aug 2026', usedIn:4 },
    { name:'Personal Accident — Driver', type:'Benefit',              lob:'Motor',    updated:'Jun 2026', usedIn:3 },
    { name:'Third Party Liability',      type:'Third Party Liability',lob:'Motor',    updated:'Aug 2026', usedIn:6 },
    { name:'Fire & Allied Perils',       type:'First Party Property', lob:'Property', updated:'Jul 2026', usedIn:2 },
    { name:'Building, Equipment & Stock — Mixed Valuation', type:'First Party Property', lob:'Property', updated:'Aug 2026', usedIn:3 },
    { name:'Business Interruption',      type:'Consequential Loss',   lob:'Property', updated:'May 2026', usedIn:1 },
    { name:'Truck Physical Damage',      type:'First Party Property', lob:'Trucking', updated:'Aug 2026', usedIn:5 },
    { name:'Motor Truck Cargo',          type:'Cargo / Transit',      lob:'Trucking', updated:'Jul 2026', usedIn:4 },
    { name:'Network Security & Privacy Liability', type:'Cyber Liability', lob:'Cyber', updated:'Aug 2026', usedIn:6 },
    { name:'Cyber Incident Response',    type:'Service / Expense',    lob:'Cyber', updated:'Aug 2026', usedIn:5 },
    { name:'Cyber Business Interruption',type:'Consequential Loss',   lob:'Cyber', updated:'Jun 2026', usedIn:3 },
    { name:'Statutory Workers Compensation Benefits', type:'Statutory Benefit', lob:'Workers Compensation', updated:'Aug 2026', usedIn:4 },
    { name:'Employers Liability',        type:'Employers Liability',  lob:'Workers Compensation', updated:'Jul 2026', usedIn:4 },
    { name:'Accidental Death',           type:'Benefit',              lob:'Life',     updated:'Mar 2026', usedIn:2 }
  ];
  PS.openModal(`
    <div class="modal-header">
      <h2 class="modal-title">Cover Library</h2>
      <button class="btn btn-icon" onclick="PS.closeModal()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="none"><path d="M205.66 194.34a8 8 0 01-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 01-11.32-11.32L116.69 128 50.34 61.66a8 8 0 0111.32-11.32L128 116.69l66.34-66.35a8 8 0 0111.32 11.32L139.31 128z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-4)">
        <div style="position:relative;flex:1"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-muted)"><svg width="13" height="13" viewBox="0 0 256 256" fill="none"><path d="M229.66 218.34l-50.07-50.07a88 88 0 10-11.31 11.31l50.06 50.07a8 8 0 0011.32-11.31zM40 112a72 72 0 1172 72 72.08 72.08 0 01-72-72z" fill="currentColor"/></svg></span>
          <input type="search" id="cover-library-search" class="form-control" placeholder="Search library…" style="padding-left:30px;height:36px" oninput="filterCoverageLibrary()"></div>
        <select id="cover-library-line" class="form-control" style="width:190px;height:36px" onchange="filterCoverageLibrary()">
          <option>All Lines</option>${PS.data.productFamilies.map(family => `<option>${family}</option>`).join('')}
        </select>
        <select id="cover-library-type" class="form-control" style="width:180px;height:36px" onchange="filterCoverageLibrary()">
          <option>All Types</option>${[...new Set(libraryCovers.map(item=>item.type))].map(type => `<option>${type}</option>`).join('')}
        </select>
      </div>
      <table class="lib-table">
        <thead><tr>
          <th style="width:32px"><input type="checkbox" style="accent-color:var(--color-brand)"></th>
          <th>Cover Name</th><th>Type</th><th>Line of Business</th><th>Last Updated</th><th class="text-center">Used In</th>
        </tr></thead>
        <tbody>
          ${libraryCovers.map((l,i) => `
          <tr data-library-name="${esc(l.name.toLowerCase())}" data-library-line="${esc(l.lob)}" data-library-type="${esc(l.type)}">
            <td><input type="checkbox" id="lib-cb-${i}" style="accent-color:var(--color-brand)"></td>
            <td style="font-weight:500">${l.name}</td>
            <td style="color:var(--color-muted)">${l.type}</td>
            <td><span class="family-badge">${l.lob}</span></td>
            <td style="color:var(--color-muted)">${l.updated}</td>
            <td class="text-center" style="color:var(--color-muted)">${l.usedIn} products</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-footer">
      <span style="font-size:13px;color:var(--color-muted);margin-right:auto">Select covers to import as draft covers</span>
      <button class="btn btn-secondary" onclick="PS.closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="importSelectedLibraryItems()">Import Selected</button>
    </div>
  `, 'modal-lg');
}

function filterCoverageLibrary() {
  const search = (document.getElementById('cover-library-search')?.value || '').toLowerCase();
  const line = document.getElementById('cover-library-line')?.value || 'All Lines';
  const type = document.getElementById('cover-library-type')?.value || 'All Types';
  document.querySelectorAll('#active-modal-overlay tbody tr').forEach(row => {
    const matches = (!search || row.dataset.libraryName.includes(search)) &&
      (line === 'All Lines' || row.dataset.libraryLine === line) &&
      (type === 'All Types' || row.dataset.libraryType === type);
    row.hidden = !matches;
  });
}
</script>
